<script>
function loadStoredArray(key){
  try{
    const value=JSON.parse(localStorage.getItem(key)||'[]');
    return Array.isArray(value)?value:[];
  }catch(error){
    return [];
  }
}
function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function renumberRows(tbodyId){
  document.querySelectorAll(`#${tbodyId} tr`).forEach((row,index)=>{
    const numberCell=row.querySelector('td.num');
    if(numberCell)numberCell.textContent=index+1;
  });
}
function localDateInputValue(){
  const now=new Date();
  const localDate=new Date(now.getTime()-now.getTimezoneOffset()*60000);
  return localDate.toISOString().split('T')[0];
}
let sheets=loadStoredArray('order_sheets'),
marginSheets=loadStoredArray('margin_sheets'),
favoriteSheetIds=new Set(loadStoredArray('favorite_margin_sheets').map(String)),sheetView='all',
currentSheetId=null,currentMarginSheetId=null,sidebarOpen=false,viewOnly=false;

/* Items feature state; restore along with the commented Items page and functions.
let items=loadStoredArray('items_data'),selectMode=false,marginSelectMode=false,
selectedItems=new Set(),marginSelectedItems=new Set();
*/

let navigationHistory=[],navigationIndex=-1,navigationBusy=false;

document.addEventListener('DOMContentLoaded',()=>{
  if(localStorage.getItem('dark_mode')!=='false')document.body.classList.add('dark');
  updateThemeIcon();
  updateAutosaveButton();
  document.getElementById('sheet-search').addEventListener('input',renderMargins);
  document.getElementById('sheet-sort').addEventListener('change',renderMargins);
  showPage('home');
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey||e.ctrlKey||e.altKey)return;
  const current=e.target;
  if(!['INPUT','TEXTAREA'].includes(current.tagName)||current.type==='file')return;
  const scope=current.closest('#editor-view')||current.closest('#margin-editor-view');
  if(!scope||viewOnly)return;
  e.preventDefault();
  const fields=[...scope.querySelectorAll('input,textarea,select')].filter(x=>!x.disabled&&!x.readOnly&&x.type!=='file'&&x.offsetParent!==null);
  const index=fields.indexOf(current);
  if(index<fields.length-1){fields[index+1].focus();fields[index+1].select?.();}
});

function currentNavigationState(){
  if(!document.getElementById('editor-view').classList.contains('hidden'))
    return {type:'order',id:currentSheetId,readOnly:viewOnly};
  if(!document.getElementById('margin-editor-view').classList.contains('hidden'))
    return {type:'margin',id:currentMarginSheetId,readOnly:viewOnly};
  return {type:'page',page:'home'};
}
function recordNavigation(state){
  if(navigationBusy)return;
  const last=navigationHistory[navigationIndex];
  if(JSON.stringify(last)===JSON.stringify(state))return;
  navigationHistory=navigationHistory.slice(0,navigationIndex+1);
  navigationHistory.push(state);navigationIndex++;
  updateNavigationButtons();
}
function updateNavigationButtons(){
  const back=document.getElementById('back-nav-btn');
  const forward=document.getElementById('forward-nav-btn');
  if(back)back.disabled=navigationIndex<=0;
  if(forward)forward.disabled=navigationIndex>=navigationHistory.length-1;
}
function navigateHistory(direction){
  const target=navigationIndex+direction;
  if(target<0||target>=navigationHistory.length)return;
  navigationIndex=target;navigationBusy=true;restoreNavigationState(navigationHistory[target]);
  navigationBusy=false;updateNavigationButtons();
}
function restoreNavigationState(state){
  if(state.type==='order'){
    const sheet=sheets.find(x=>x.id===state.id);
    if(sheet){loadSheet(sheet);showEditor(state.readOnly);}
    return;
  }
  if(state.type==='margin'){
    const sheet=marginSheets.find(x=>x.id===state.id);
    if(sheet){loadMarginSheet(sheet);showMarginEditor(state.readOnly);}
    return;
  }
  showPage(state.page);
}

function toggleSidebar(){
  sidebarOpen=!sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open',sidebarOpen);
  document.getElementById('sidebar').classList.toggle('hidden',!sidebarOpen);
  document.getElementById('sidebar-overlay').classList.toggle('show',sidebarOpen);
  document.body.classList.toggle('sidebar-open',sidebarOpen);
  const button=document.getElementById('menu-toggle');
  button?.setAttribute('aria-expanded',String(sidebarOpen));
  if(button)button.title=sidebarOpen?'Close menu':'Open menu';
}
function closeSidebar(){
  sidebarOpen=false;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('sidebar-overlay').classList.remove('show');
  document.body.classList.remove('sidebar-open');
  const button=document.getElementById('menu-toggle');
  button?.setAttribute('aria-expanded','false');
  if(button)button.title='Open menu';
}
function toggleSearchPanel(){
  const panel=document.getElementById('sheet-filters');
  const button=document.getElementById('search-toggle');
  const isOpen=panel.classList.toggle('open');
  button.setAttribute('aria-expanded',String(isOpen));
  if(isOpen)document.getElementById('sheet-search').focus();
}
document.addEventListener('click',event=>{
  const control=document.querySelector('.search-control');
  if(control&&!control.contains(event.target)){
    document.getElementById('sheet-filters').classList.remove('open');
    document.getElementById('search-toggle').setAttribute('aria-expanded','false');
  }
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){
    const searchWasOpen=document.getElementById('sheet-filters').classList.contains('open');
    document.getElementById('sheet-filters').classList.remove('open');
    document.getElementById('search-toggle').setAttribute('aria-expanded','false');
    if(sidebarOpen){closeSidebar();document.getElementById('menu-toggle')?.focus();}
    else if(searchWasOpen)document.getElementById('search-toggle')?.focus();
  }
});
function showPage(){
  document.body.classList.remove('editor-active');
  document.getElementById('home-page').classList.add('active');
  document.getElementById('editor-view').classList.add('hidden');
  document.getElementById('margin-editor-view').classList.add('hidden');
  viewOnly=false;
  renderMargins();closeSidebar();
  recordNavigation({type:'page',page:'home'});
}
function showEditor(readOnly=false){
  document.body.classList.add('editor-active');
  viewOnly=readOnly;
  document.getElementById('home-page').classList.remove('active');
  document.getElementById('editor-view').classList.remove('hidden');
  document.getElementById('margin-editor-view').classList.add('hidden');
  setEditorMode('editor-view',readOnly);
  recordNavigation({type:'order',id:currentSheetId,readOnly});
}
function showMarginEditor(readOnly=false){
  document.body.classList.add('editor-active');
  viewOnly=readOnly;
  document.getElementById('home-page').classList.remove('active');
  document.getElementById('editor-view').classList.add('hidden');
  document.getElementById('margin-editor-view').classList.remove('hidden');
  setEditorMode('margin-editor-view',readOnly);
  recordNavigation({type:'margin',id:currentMarginSheetId,readOnly});
}
function setEditorMode(id,readOnly){
  const root=document.getElementById(id);
  root.classList.toggle('readonly',readOnly);
  root.querySelectorAll('input').forEach(input=>input.readOnly=readOnly);
  root.querySelectorAll('.action-cell button').forEach(button=>button.classList.toggle('hidden',readOnly));
  root.querySelectorAll('.save-sheet-btn,.save-margin-btn').forEach(button=>button.classList.toggle('hidden',readOnly));
  root.querySelectorAll('#edit-sheet-btn,#edit-margin-btn').forEach(button=>button.classList.toggle('hidden',!readOnly));
  root.querySelectorAll('#download-sheet-btn,#download-margin-btn').forEach(button=>button.classList.toggle('hidden',!readOnly));
  root.querySelectorAll('.btn-fab-left').forEach(button=>button.classList.toggle('hidden',readOnly));
}
function isAutosaveEnabled(){return localStorage.getItem('autosave_enabled')!=='false'}
function updateAutosaveButton(){
  const enabled=isAutosaveEnabled();
  const button=document.getElementById('autosave-toggle');
  const state=document.getElementById('autosave-state');
  if(button)button.setAttribute('aria-pressed',String(enabled));
  if(state)state.textContent=enabled?'On':'Off';
  const desktopState=document.getElementById('desktop-autosave-state');
  if(desktopState)desktopState.textContent=enabled?'On':'Off';
}
function toggleAutosave(){
  localStorage.setItem('autosave_enabled',String(!isAutosaveEnabled()));
  updateAutosaveButton();
  if(isAutosaveEnabled())autosaveCurrentSheet();
}
function autosaveCurrentSheet(){
  if(!isAutosaveEnabled()||viewOnly)return;
  if(!document.getElementById('margin-editor-view').classList.contains('hidden')){
    if(!currentMarginSheetId)return;
    const data={id:currentMarginSheetId,name:document.getElementById('margin-sheet-name').value.trim()||'Untitled Sheet',date:document.getElementById('margin-sheet-date').value,totalProfit:+document.getElementById('margin-grand-total').textContent,items:[...document.querySelectorAll('#margin-products-tbody tr')].map(row=>({name:row.querySelector('.margin-name').value,sellPrice:+row.querySelector('.margin-sell').value||0,buyPrice:+row.querySelector('.margin-buy').value||0,qty:+row.querySelector('.margin-qty').value||0}))};
    const index=marginSheets.findIndex(sheet=>sheet.id===currentMarginSheetId);
    if(index<0)marginSheets.push(data);else marginSheets[index]=data;
    localStorage.setItem('margin_sheets',JSON.stringify(marginSheets));
  }
}
function goBackToSheets(){
  if(isAutosaveEnabled())autosaveCurrentSheet();
  showPage('home');
}
function cancelMarginSheet(){
  goBackToSheets();
}
document.addEventListener('input',event=>{
  if(event.target.closest('#margin-editor-view'))autosaveCurrentSheet();
});
window.addEventListener('pagehide',autosaveCurrentSheet);
function updateThemeIcon(){
  const button=document.getElementById('theme-toggle');
  if(!button)return;
  const dark=document.body.classList.contains('dark');
  button.title=dark?'Switch to light mode':'Switch to dark mode';
  button.setAttribute('aria-label',button.title);
  button.innerHTML=dark
    ?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"></path></svg>'
    :'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>';
}
function toggleDarkMode(){
  document.body.classList.toggle('dark');
  localStorage.setItem('dark_mode',document.body.classList.contains('dark'));
  updateThemeIcon();
}
/* Items feature paused for now; uncomment this helper and the related selection functions to restore it.
function updateSelectionButtons(){
  document.getElementById('sheet-select-btn')?.classList.toggle('hidden',viewOnly||marginSelectMode);
  document.getElementById('sheet-done-btn')?.classList.toggle('hidden',viewOnly||!selectMode);
  document.getElementById('selection-banner')?.classList.toggle('show',!viewOnly&&(selectMode||marginSelectMode));
}

function addProductRow(d={name:'',price:'',qty:''}){
  const t=document.getElementById('products-tbody'),r=t.insertRow();
  r.innerHTML=`<td class="num">${t.rows.length}</td><td><input class="cell-input prod-name" value="${escapeHtml(d.name)}"></td><td><input type="number" class="cell-input prod-price" value="${escapeHtml(d.price)}" oninput="calculateTotal()"></td><td><input type="number" class="cell-input prod-qty" value="${escapeHtml(d.qty)}" oninput="calculateTotal()"></td><td class="action-cell action-column"><button type="button" class="btn btn-danger btn-sm" aria-label="Delete row" title="Delete row" onclick="this.closest('tr').remove();renumberRows('products-tbody');calculateTotal()">×</button></td>`;
}
function addMarginProductRow(d={name:'',sellPrice:'',buyPrice:'',qty:''}){
  const t=document.getElementById('margin-products-tbody'),r=t.insertRow();
  r.innerHTML=`<td class="num">${t.rows.length}</td><td><input class="cell-input margin-name" value="${escapeHtml(d.name)}"></td><td><input type="number" class="cell-input margin-sell" value="${escapeHtml(d.sellPrice)}" oninput="calculateMarginTotal()"></td><td class="buy-price-column"><input type="number" class="cell-input margin-buy" value="${escapeHtml(d.buyPrice)}" oninput="calculateMarginTotal()"></td><td><input type="number" class="cell-input margin-qty" value="${escapeHtml(d.qty)}" oninput="calculateMarginTotal()"></td><td class="action-cell action-column"><button type="button" class="btn btn-danger btn-sm" aria-label="Delete row" title="Delete row" onclick="this.closest('tr').remove();renumberRows('margin-products-tbody');calculateMarginTotal()">×</button></td>`;
}
function toggleBuyPriceColumn(){
  const editor=document.getElementById('margin-editor-view');
  const button=editor.querySelector('.buy-price-toggle');
  const hidden=editor.classList.toggle('hide-buy-price');
  button.setAttribute('aria-label',hidden?'Show buy cost':'Hide buy cost');
  button.setAttribute('aria-pressed',String(!hidden));
  button.title=hidden?'Show or hide buy cost':'Hide or show buy cost';
}
function createNewSheet(){
  currentSheetId=Date.now().toString();viewOnly=false;
  document.getElementById('sheet-name').value='';
  document.getElementById('sheet-date').value=localDateInputValue();
  document.getElementById('products-tbody').innerHTML='';
  for(let i=0;i<10;i++)addProductRow();
  calculateTotal();showEditor();
}
function createNewMarginSheet(){
  currentMarginSheetId=Date.now().toString();viewOnly=false;
  document.getElementById('margin-sheet-name').value='';
  document.getElementById('margin-sheet-date').value=localDateInputValue();
  document.getElementById('margin-products-tbody').innerHTML='';
  for(let i=0;i<10;i++)addMarginProductRow();
  calculateMarginTotal();showMarginEditor();
}
/* Items selection feature paused; restore together with the Items page.
function toggleItemSelectMode(){
  selectMode=true;marginSelectMode=false;selectedItems.clear();
  updateSelectionButtons();renderItems();showPage('items');updateSelectionButtons();
}
function toggleMarginItemSelectMode(){
  marginSelectMode=true;selectMode=false;marginSelectedItems.clear();
  updateSelectionButtons();renderItems();showPage('items');updateSelectionButtons();
}
function toggleItemSelection(id){
  if(!selectMode&&!marginSelectMode)return;
  const set=marginSelectMode?marginSelectedItems:selectedItems;
  set.has(id)?set.delete(id):set.add(id);renderItems();
}
function pasteSelectedItems(){
  if(marginSelectMode){
    marginSelectedItems.forEach(id=>{
      const i=items.find(x=>x.id===id);
      if(i)addMarginProductRow({name:i.name,sellPrice:i.price,buyPrice:i.buyPrice,qty:1});
    });
    marginSelectedItems.clear();marginSelectMode=false;calculateMarginTotal();showMarginEditor();return;
  }
  selectedItems.forEach(id=>{
    const i=items.find(x=>x.id===id);
    if(i)addProductRow({name:i.name,price:i.price,qty:1});
  });
  selectedItems.clear();selectMode=false;calculateTotal();showEditor();
}
*/
function calculateTotal(){
  let total=0;
  document.querySelectorAll('.prod-price').forEach((x,i)=>{
    total+=(+x.value||0)*(+document.querySelectorAll('.prod-qty')[i].value||0);
  });
  document.getElementById('grand-total').textContent=total.toFixed(2);
}
function calculateMarginTotal(){
  let total=0;
  document.querySelectorAll('#margin-products-tbody tr').forEach(r=>{
    total+=((+r.querySelector('.margin-sell').value||0)-(+r.querySelector('.margin-buy').value||0))*(+r.querySelector('.margin-qty').value||0);
  });
  document.getElementById('margin-grand-total').textContent=total.toFixed(2);
}
/* Items feature paused for now; restore this block with the commented Items page markup.
function addItemForm(){
  const area=document.getElementById('items-form-area'),form=document.createElement('div');
  form.className='item-form';
  form.innerHTML=`<div class="form-row"><div class="form-group"><label>Name</label><input class="item-name" placeholder="Item name"></div><div class="form-group"><label>Price per qty (PKR)</label><input type="number" class="item-price" placeholder="0.00"></div></div><div class="form-group"><label>Buy price/qty (PKR)</label><input type="number" class="item-buy-price" placeholder="0.00"></div><div class="form-group"><label>Images</label><input type="file" class="item-images" accept="image/*" multiple></div><div class="form-group"><label>Details</label><textarea class="item-details" rows="3"></textarea></div><div class="action-bar"><button class="btn btn-secondary" onclick="this.closest('.item-form').remove()">Cancel</button><button class="btn btn-primary" onclick="saveItem(this)">Save</button></div>`;
  area.prepend(form);
}
function readImages(form){
  return Promise.all([...form.querySelector('.item-images').files].map(file=>new Promise(resolve=>{
    const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file);
  })));
}
function saveItem(button){
  const form=button.closest('.item-form');
  readImages(form).then(images=>{
    items.unshift({id:Date.now().toString(),name:form.querySelector('.item-name').value.trim(),price:+form.querySelector('.item-price').value||0,buyPrice:+form.querySelector('.item-buy-price').value||0,details:form.querySelector('.item-details').value.trim(),images});
    localStorage.setItem('items_data',JSON.stringify(items));form.remove();renderItems();
  });
}
function renderItems(){
  const list=document.getElementById('items-list');
  list.innerHTML=items.length?'':'<p style="color:var(--muted)">No items added yet.</p>';
  items.forEach((item,index)=>{

function renderHome(){
  const list=document.getElementById('sheet-list');
  list.innerHTML=sheets.length?'':'<p style="color:var(--muted)">No sheets yet.</p>';
  sheets.forEach(sheet=>{
    const card=document.createElement('div');card.className='sheet-card';
    card.innerHTML=`<div class="sheet-info"><h3>${escapeHtml(sheet.name||'Untitled Sheet')}</h3><p>Date: ${escapeHtml(sheet.date||'N/A')} | Total: PKR ${(Number(sheet.totalCost)||0).toFixed(2)}</p></div><div class="card-actions"><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();editSheet('${escapeHtml(sheet.id)}')">Edit</button><button class="btn btn-danger btn-sm" aria-label="Delete sheet" onclick="event.stopPropagation();deleteSheet('${escapeHtml(sheet.id)}')">×</button></div>`;
    card.onclick=()=>viewSheet(sheet.id);list.appendChild(card);
  });
}
function setSheetView(view){
  sheetView=view==='favorites'?'favorites':'all';
  const viewTitle=sheetView==='favorites'?'Favourites':'All sheets';
  document.getElementById('sheet-section-title').textContent=viewTitle;
  document.getElementById('sheet-view-caption').textContent=sheetView==='favorites'?'Sheets you have saved for quick access':'Your recent sheets';
  document.getElementById('nav-all')?.classList.toggle('active',sheetView==='all');
  document.getElementById('nav-favorites')?.classList.toggle('active',sheetView==='favorites');
  document.getElementById('nav-all-mobile')?.setAttribute('aria-current',sheetView==='all'?'page':'false');
  document.getElementById('nav-favorites-mobile')?.setAttribute('aria-current',sheetView==='favorites'?'page':'false');
  renderMargins();
}
function toggleFavoriteSheet(id){
  id=String(id);
  favoriteSheetIds.has(id)?favoriteSheetIds.delete(id):favoriteSheetIds.add(id);
  localStorage.setItem('favorite_margin_sheets',JSON.stringify([...favoriteSheetIds]));
  renderMargins();
}
function renderMargins(){
  const list=document.getElementById('margins-list');
  const search=(document.getElementById('sheet-search')?.value||'').trim();
  const normalizeSearch=value=>String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
  const searchTerms=normalizeSearch(search).split(/\s+/).filter(Boolean);
  const sort=document.getElementById('sheet-sort')?.value||'date-desc';
  const favoriteCount=document.getElementById('favorite-count');
  if(favoriteCount)favoriteCount.textContent=favoriteSheetIds.size?`(${favoriteSheetIds.size})`:'';
  const filtered=marginSheets.filter(sheet=>{
    if(sheetView==='favorites'&&!favoriteSheetIds.has(String(sheet.id)))return false;
    if(!search)return true;
    const searchableText=normalizeSearch([
      sheet.name,sheet.date,
      ...(sheet.items||[]).flatMap(item=>[item.name,item.sellPrice,item.buyPrice,item.qty])
    ].join(' '));
    return searchTerms.every(term=>searchableText.includes(term));
  });
  filtered.sort((a,b)=>{
    if(sort==='name-asc')return String(a.name||'Untitled Sheet').localeCompare(String(b.name||'Untitled Sheet'));
    if(sort==='profit-desc')return (Number(b.totalProfit)||0)-(Number(a.totalProfit)||0);
    const dateOrder=String(a.date||'').localeCompare(String(b.date||''));
    return sort==='date-asc'?dateOrder:-dateOrder;
  });
  list.innerHTML=filtered.length?'':`<p>${sheetView==='favorites'?(search?'No favourites match your search.':'No favourite sheets yet. Mark a sheet with ☆ to save it here.'):(marginSheets.length?(search?'No sheets match your search.':'No sheets yet.'):'No sheets yet. Create a sheet to start tracking your products and profit.')}</p>`;
  filtered.forEach(sheet=>{
    const card=document.createElement('div');card.className='sheet-card';
    const itemCount=(sheet.items||[]).filter(item=>String(item.name||'').trim()).length;
    const isFavorite=favoriteSheetIds.has(String(sheet.id));
    card.innerHTML=`<div class="sheet-info"><h3>${escapeHtml(sheet.name||'Untitled Sheet')}</h3><p>${escapeHtml(sheet.date||'No date')} · ${itemCount} product${itemCount===1?'':'s'} · Profit: PKR ${(Number(sheet.totalProfit)||0).toFixed(2)}</p></div><div class="card-actions"><button class="favorite-btn${isFavorite?' active':''}" type="button" aria-label="${isFavorite?'Remove from':'Add to'} favourites" aria-pressed="${isFavorite}" title="${isFavorite?'Remove from':'Add to'} favourites" onclick="event.stopPropagation();toggleFavoriteSheet('${escapeHtml(sheet.id)}')">${isFavorite?'★':'☆'}</button><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();editMarginSheet('${escapeHtml(sheet.id)}')">Edit</button><button class="btn btn-danger btn-sm" aria-label="Delete margin sheet" onclick="event.stopPropagation();deleteMarginSheet('${escapeHtml(sheet.id)}')">×</button></div>`;
    card.onclick=()=>viewMarginSheet(sheet.id);list.appendChild(card);
  });
}

function downloadSheetImage(type){
  const isMargin=type==='margin';
  const name=document.getElementById(isMargin?'margin-sheet-name':'sheet-name').value.trim()||'sheet';
  const date=document.getElementById(isMargin?'margin-sheet-date':'sheet-date').value||'N/A';
  const rows=[...document.querySelectorAll(isMargin?'#margin-products-tbody tr':'#products-tbody tr')];
  const width=1100,rowHeight=48,headerHeight=150,height=headerHeight+(rows.length+1)*rowHeight+80;
  const canvas=document.createElement('canvas');
  canvas.width=width;canvas.height=height;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,width,height);
  ctx.fillStyle='#171a1c';ctx.fillRect(0,0,width,92);
  ctx.fillStyle='#ffffff';ctx.font='bold 30px Arial';ctx.fillText(name,35,42);
  ctx.font='18px Arial';ctx.fillText('Date: '+date,35,72);
  const headers=isMargin?['No.','Product','Price','Cost Price','Qty']:['No.','Product','Price (PKR)','Qty'];
  const widths=isMargin?[80,430,190,190,110]:[80,500,220,160];
  let y=headerHeight,x=0;
  ctx.font='bold 17px Arial';ctx.fillStyle='#f1e5c8';
  headers.forEach((header,i)=>{ctx.fillRect(x,y,widths[i],rowHeight);ctx.fillStyle='#111827';ctx.fillText(header,x+10,y+30);ctx.strokeStyle='#9ca3af';ctx.strokeRect(x,y,widths[i],rowHeight);ctx.fillStyle='#f1e5c8';x+=widths[i];});
  y+=rowHeight;
  ctx.font='16px Arial';
  rows.forEach((row,index)=>{
    const values=isMargin?
      [index+1,row.querySelector('.margin-name').value,row.querySelector('.margin-sell').value,row.querySelector('.margin-buy').value,row.querySelector('.margin-qty').value]:
      [index+1,row.querySelector('.prod-name').value,row.querySelector('.prod-price').value,row.querySelector('.prod-qty').value];
    x=0;values.forEach((value,i)=>{ctx.fillStyle='#ffffff';ctx.fillRect(x,y,widths[i],rowHeight);ctx.fillStyle='#111827';ctx.fillText(String(value||''),x+10,y+30);ctx.strokeStyle='#cbd5e1';ctx.strokeRect(x,y,widths[i],rowHeight);x+=widths[i];});y+=rowHeight;
  });
  const total=document.getElementById(isMargin?'margin-grand-total':'grand-total').textContent;
  ctx.font='bold 20px Arial';ctx.fillStyle='#111827';ctx.fillText((isMargin?'Total: PKR ':'Total Cost: PKR ')+total,35,height-25);
  const link=document.createElement('a');
  link.download=name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.png';
  link.href=canvas.toDataURL('image/png');link.click();
}

  if(viewOnly)return;

  const index=sheets.findIndex(x=>x.id===currentSheetId);index<0?sheets.push(data):sheets[index]=data;
  localStorage.setItem('order_sheets',JSON.stringify(sheets));showPage('home');
}
function saveCurrentMarginSheet(){

<script>
  let deferredInstallPrompt = null;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(() => console.log('Service worker registered'))
        .catch(error => console.error('Service worker registration failed:', error));
    });
  }

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;

    const installButton = document.createElement('button');
    installButton.id = 'install-app-btn';
    installButton.className = 'btn btn-primary';
    installButton.textContent = 'Install App';
    installButton.style.cssText =
      'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:150;box-shadow:0 14px 32px rgba(0,0,0,.2)';

    installButton.onclick = async () => {
      if (!deferredInstallPrompt) return;

      deferredInstallPrompt.prompt();
      const result = await deferredInstallPrompt.userChoice;

      if (result.outcome === 'accepted') {
        installButton.remove();
      }

      deferredInstallPrompt = null;
    };

    document.body.appendChild(installButton);
  });

  window.addEventListener('appinstalled', () => {
    document.getElementById('install-app-btn')?.remove();
    deferredInstallPrompt = null;
  });
</script>
