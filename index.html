    /* Shadow Monarch workspace theme and responsive dashboard. */
    :root{

      --selected:rgba(139,92,246,.13);--selected-border:rgba(139,92,246,.55);

    body.dark{

      --card-solid:#15192a;--text:#f2f3ff;--muted:#929bb8;--border:#252a42;--danger:#fb7185;
      --grid:#2b3150;--sidebar:#101321;--sidebar-border:#252a42;--toggle-off:#454d68;
      --toggle-on:#8b5cf6;--selected:rgba(139,92,246,.13);--selected-border:rgba(139,92,246,.55);

    }
    body:not(.dark){
      color-scheme:light;--primary:#6338c9;--primary-hover:#5129b0;--bg:#f5f4fb;--card:#fff;
      --card-solid:#fff;--text:#1d1b29;--muted:#716d82;--border:#e5e1ef;--danger:#c2415b;
      --grid:#e6e2ed;--sidebar:#fff;--sidebar-border:#e5e1ef;--selected:rgba(99,56,201,.1);

      --btn-gradient:linear-gradient(120deg,#7c3aed,#2563eb);

<script>
function loadStoredArray(key){
  try{
    const value=JSON.parse(localStorage.getItem(key)||'[]');
    return Array.isArray(value)?value:[];
  }catch(error){
    return [];
  }
}
let toastTimer;
function showToast(message){
  const toast=document.getElementById('toast');
  toast.textContent=message;toast.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);
}
function toggleMenuSettings(){
  const panel=document.getElementById('menu-settings');
  const button=document.getElementById('settings-toggle');
  const open=panel.hidden;
  panel.hidden=!open;button.setAttribute('aria-expanded',String(open));
}
function getEnterNavigationMode(){
  return localStorage.getItem('enter_navigation_mode')==='column'?'column':'row';
}
function updateEnterNavigationOptions(){
  const mode=getEnterNavigationMode();
  document.querySelectorAll('.enter-mode-options').forEach(options=>{
    options.classList.toggle('column-selected',mode==='column');
    options.classList.toggle('row-selected',mode==='row');
    options.querySelectorAll('[data-enter-mode]').forEach(button=>{
      const selected=button.dataset.enterMode===mode;
      button.setAttribute('aria-checked',String(selected));
      button.setAttribute('aria-pressed',String(selected));
    });
  });
}
function toggleEditorSettings(button){
  const panel=button.parentElement.querySelector('.editor-settings-popover');
  const open=panel.hidden;
  document.querySelectorAll('.editor-settings-popover').forEach(item=>item.hidden=true);
  document.querySelectorAll('.editor-settings-toggle').forEach(item=>item.setAttribute('aria-expanded','false'));
  panel.hidden=!open;button.setAttribute('aria-expanded',String(open));
  updateEnterNavigationOptions();
}
function setEnterNavigation(mode){
  localStorage.setItem('enter_navigation_mode',mode==='column'?'column':'row');
  updateEnterNavigationOptions();
}
function openAppModal(title,content,actions){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-content').innerHTML=content;
  const actionArea=document.getElementById('modal-actions');
  actionArea.replaceChildren();
  actions.forEach(({label,className='btn btn-secondary',onClick})=>{
    const button=document.createElement('button');button.type='button';button.className=className;button.textContent=label;
    button.addEventListener('click',onClick);actionArea.appendChild(button);
  });
  document.getElementById('app-modal-backdrop').hidden=false;
  actionArea.querySelector('button:last-child')?.focus();
}
function closeAppModal(){document.getElementById('app-modal-backdrop').hidden=true;}
function confirmApp(message,confirmLabel='Delete'){
  return new Promise(resolve=>openAppModal('Please confirm',`<p>${escapeHtml(message)}</p>`,[
    {label:'Cancel',onClick:()=>{closeAppModal();resolve(false);}},
    {label:confirmLabel,className:'btn btn-danger',onClick:()=>{closeAppModal();resolve(true);}}
  ]));
}
function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function renumberRows(tbodyId){
  document.querySelectorAll(`#${tbodyId} tr`).forEach((row,index)=>{
    const numberCell=row.querySelector('td.num');
    if(numberCell)numberCell.textContent=index+1;
  });
}
function localDateInputValue(){
  const now=new Date();
  const localDate=new Date(now.getTime()-now.getTimezoneOffset()*60000);
  return localDate.toISOString().split('T')[0];
}
let sheets=loadStoredArray('order_sheets'),
marginSheets=loadStoredArray('margin_sheets'),
favoriteSheetIds=new Set(loadStoredArray('favorite_margin_sheets').map(String)),sheetView='all',
currentSheetId=null,currentMarginSheetId=null,sidebarOpen=false,viewOnly=false;

/* Items feature state; restore along with the commented Items page and functions.
let items=loadStoredArray('items_data'),selectMode=false,marginSelectMode=false,
selectedItems=new Set(),marginSelectedItems=new Set();
*/

let navigationHistory=[],navigationIndex=-1,navigationBusy=false;

document.addEventListener('DOMContentLoaded',()=>{
  if(localStorage.getItem('dark_mode')!=='false')document.body.classList.add('dark');
  updateThemeIcon();
  updateAutosaveButton();
  updateEnterNavigationOptions();
  document.getElementById('sheet-search').addEventListener('input',renderMargins);
  const sortSelect=document.getElementById('sheet-sort');
  sortSelect.addEventListener('change',()=>{renderMargins();syncPhoneSortMenu();});
  document.getElementById('sort-menu-toggle').addEventListener('click',togglePhoneSortMenu);
  document.getElementById('sort-menu').addEventListener('click',event=>{
    const option=event.target.closest('[data-sort]');
    if(!option)return;
    sortSelect.value=option.dataset.sort;
    sortSelect.dispatchEvent(new Event('change'));
    closePhoneSortMenu();
  });
  document.addEventListener('click',event=>{
    if(!event.target.closest('.sort-control'))closePhoneSortMenu();
  });
  showPage('home');
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey||e.ctrlKey||e.altKey)return;
  const current=e.target;
  if(!['INPUT','TEXTAREA'].includes(current.tagName)||current.type==='file')return;
  const scope=current.closest('#editor-view')||current.closest('#margin-editor-view');
  if(!scope||viewOnly)return;
  e.preventDefault();

  const row=current.closest('#products-tbody tr, #margin-products-tbody tr');
  const rowField=['prod-name','prod-price','prod-qty','margin-name','margin-sell','margin-buy','margin-qty']
    .find(className=>current.classList.contains(className));
  if(row&&rowField){
    const visibleInputs=()=>[...row.querySelectorAll('input')].filter(input=>input.offsetParent!==null&&!input.disabled);
    const mode=getEnterNavigationMode();
    if(mode==='column'){
      const fields=visibleInputs();
      const nextField=fields[fields.indexOf(current)+1];
      if(nextField){nextField.focus();return;}
      let nextRow=row.nextElementSibling;
      if(!nextRow){
        if(row.closest('#margin-products-tbody'))addMarginProductRow();
        else addProductRow();
        nextRow=row.nextElementSibling;
      }
      nextRow?.querySelector('input:not([disabled])')?.focus();
      return;
    }
    let nextRow=row.nextElementSibling;
    if(!nextRow){
      if(row.closest('#margin-products-tbody'))addMarginProductRow();
      else addProductRow();
      nextRow=row.nextElementSibling;
    }
    const nextInput=nextRow?.querySelector(`.${rowField}`);
    (nextInput&&nextInput.offsetParent!==null?nextInput:nextRow?.querySelector('input:not([disabled])'))?.focus();
    return;
  }

  const fields=[...scope.querySelectorAll('input,textarea,select')].filter(x=>!x.disabled&&!x.readOnly&&x.type!=='file'&&x.offsetParent!==null);
  const index=fields.indexOf(current);
  if(index<fields.length-1){
    const nextField=fields[index+1];
    nextField.focus();
    if(nextField.tagName==='TEXTAREA'||['text','search','tel','url','password'].includes(nextField.type))nextField.select();
  }
});

function currentNavigationState(){
  if(!document.getElementById('editor-view').classList.contains('hidden'))
    return {type:'order',id:currentSheetId,readOnly:viewOnly};
  if(!document.getElementById('margin-editor-view').classList.contains('hidden'))
    return {type:'margin',id:currentMarginSheetId,readOnly:viewOnly};
  return {type:'page',page:'home'};
}
function recordNavigation(state){
  if(navigationBusy)return;
  const last=navigationHistory[navigationIndex];
  if(JSON.stringify(last)===JSON.stringify(state))return;
  navigationHistory=navigationHistory.slice(0,navigationIndex+1);
  navigationHistory.push(state);navigationIndex++;
  updateNavigationButtons();
}
function updateNavigationButtons(){
  const back=document.getElementById('back-nav-btn');
  const forward=document.getElementById('forward-nav-btn');
  if(back)back.disabled=navigationIndex<=0;
  if(forward)forward.disabled=navigationIndex>=navigationHistory.length-1;
}
function navigateHistory(direction){
  const target=navigationIndex+direction;
  if(target<0||target>=navigationHistory.length)return;
  navigationIndex=target;navigationBusy=true;restoreNavigationState(navigationHistory[target]);
  navigationBusy=false;updateNavigationButtons();
}
function restoreNavigationState(state){
  if(state.type==='order'){
    const sheet=sheets.find(x=>x.id===state.id);
    if(sheet){loadSheet(sheet);showEditor(state.readOnly);}
    return;
  }
  if(state.type==='margin'){
    const sheet=marginSheets.find(x=>x.id===state.id);
    if(sheet){loadMarginSheet(sheet);showMarginEditor(state.readOnly);}
    return;
  }
  showPage(state.page);
}

function toggleSidebar(){
  if(sidebarOpen){closeSidebar();return;}
  sidebarOpen=true;
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar').classList.toggle('hidden',!sidebarOpen);
  document.getElementById('sidebar-overlay').classList.toggle('show',sidebarOpen);
  document.body.classList.toggle('sidebar-open',sidebarOpen);
  const button=document.getElementById('menu-toggle');
  button?.setAttribute('aria-expanded',String(sidebarOpen));
  if(button)button.title=sidebarOpen?'Close menu':'Open menu';
}
function closeSidebar(){
  sidebarOpen=false;
  const settingsPanel=document.getElementById('menu-settings');
  const settingsButton=document.getElementById('settings-toggle');
  if(settingsPanel)settingsPanel.hidden=true;
  settingsButton?.setAttribute('aria-expanded','false');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('sidebar-overlay').classList.remove('show');
  document.body.classList.remove('sidebar-open');
  const button=document.getElementById('menu-toggle');
  button?.setAttribute('aria-expanded','false');
  if(button)button.title='Open menu';
}
function toggleSearchPanel(){
  const panel=document.getElementById('sheet-filters');
  const button=document.getElementById('search-toggle');
  const isOpen=panel.classList.toggle('open');
  button.setAttribute('aria-expanded',String(isOpen));
  if(isOpen)document.getElementById('sheet-search').focus();
}
function syncPhoneSortMenu(){
  const select=document.getElementById('sheet-sort');
  const button=document.getElementById('sort-menu-toggle');
  const menu=document.getElementById('sort-menu');
  if(!select||!button||!menu)return;
  const selected=select.options[select.selectedIndex];
  button.innerHTML=`Sort: ${escapeHtml(selected.textContent)} <span aria-hidden="true">⌄</span>`;
  menu.querySelectorAll('[data-sort]').forEach(option=>{
    option.setAttribute('aria-checked',String(option.dataset.sort===select.value));
  });
}
function togglePhoneSortMenu(){
  const menu=document.getElementById('sort-menu');
  const button=document.getElementById('sort-menu-toggle');
  const isOpen=menu.classList.toggle('open');
  button.setAttribute('aria-expanded',String(isOpen));
}
function closePhoneSortMenu(){
  const menu=document.getElementById('sort-menu');
  const button=document.getElementById('sort-menu-toggle');
  menu?.classList.remove('open');
  button?.setAttribute('aria-expanded','false');
}
document.addEventListener('click',event=>{
  if(event.target.id==='app-modal-backdrop')document.querySelector('#modal-actions button')?.click();
  if(!event.target.closest('.editor-tools')){
    document.querySelectorAll('.editor-settings-popover').forEach(panel=>panel.hidden=true);
    document.querySelectorAll('.editor-settings-toggle').forEach(button=>button.setAttribute('aria-expanded','false'));
  }
  const control=document.querySelector('.search-control');
  if(control&&!control.contains(event.target)){
    document.getElementById('sheet-filters').classList.remove('open');
    document.getElementById('search-toggle').setAttribute('aria-expanded','false');
  }
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){
    if(!document.getElementById('app-modal-backdrop').hidden)document.querySelector('#modal-actions button')?.click();
    closePhoneSortMenu();
    const editorSettingsWasOpen=[...document.querySelectorAll('.editor-settings-popover')].some(panel=>!panel.hidden);
    document.querySelectorAll('.editor-settings-popover').forEach(panel=>panel.hidden=true);
    document.querySelectorAll('.editor-settings-toggle').forEach(button=>button.setAttribute('aria-expanded','false'));
    const searchWasOpen=document.getElementById('sheet-filters').classList.contains('open');
    document.getElementById('sheet-filters').classList.remove('open');
    document.getElementById('search-toggle').setAttribute('aria-expanded','false');
    if(sidebarOpen){closeSidebar();document.getElementById('menu-toggle')?.focus();}
    else if(searchWasOpen)document.getElementById('search-toggle')?.focus();
    else if(editorSettingsWasOpen)document.querySelector('.editor-settings-toggle')?.focus();
  }
});
function showPage(){
  document.body.classList.remove('editor-active');
  document.getElementById('home-page').classList.add('active');
  document.getElementById('editor-view').classList.add('hidden');
  document.getElementById('margin-editor-view').classList.add('hidden');
  viewOnly=false;
  renderMargins();closeSidebar();
  recordNavigation({type:'page',page:'home'});
}
function showEditor(readOnly=false){
  document.body.classList.add('editor-active');
  viewOnly=readOnly;
  document.getElementById('home-page').classList.remove('active');
  document.getElementById('editor-view').classList.remove('hidden');
  document.getElementById('margin-editor-view').classList.add('hidden');
  setEditorMode('editor-view',readOnly);
  recordNavigation({type:'order',id:currentSheetId,readOnly});
}
function showMarginEditor(readOnly=false){
  document.body.classList.add('editor-active');
  viewOnly=readOnly;
  document.getElementById('home-page').classList.remove('active');
  document.getElementById('editor-view').classList.add('hidden');
  document.getElementById('margin-editor-view').classList.remove('hidden');
  setEditorMode('margin-editor-view',readOnly);
  recordNavigation({type:'margin',id:currentMarginSheetId,readOnly});
}
function setEditorMode(id,readOnly){
  const root=document.getElementById(id);
  root.classList.toggle('readonly',readOnly);
  root.querySelectorAll('input').forEach(input=>input.readOnly=readOnly);
  root.querySelectorAll('.action-cell button').forEach(button=>button.classList.toggle('hidden',readOnly));
  root.querySelectorAll('.save-sheet-btn,.save-margin-btn').forEach(button=>button.classList.toggle('hidden',readOnly));
  root.querySelectorAll('#edit-sheet-btn,#edit-margin-btn').forEach(button=>button.classList.toggle('hidden',!readOnly));
  root.querySelectorAll('#download-sheet-btn,#download-margin-btn').forEach(button=>button.classList.toggle('hidden',!readOnly));
  root.querySelectorAll('.btn-fab-left').forEach(button=>button.classList.toggle('hidden',readOnly));
}
function isAutosaveEnabled(){return localStorage.getItem('autosave_enabled')!=='false'}
function updateAutosaveButton(){
  const enabled=isAutosaveEnabled();
  const button=document.getElementById('autosave-toggle');
  const state=document.getElementById('autosave-state');
  if(button)button.setAttribute('aria-pressed',String(enabled));
  if(state)state.textContent=enabled?'On':'Off';
  const desktopState=document.getElementById('desktop-autosave-state');
  if(desktopState)desktopState.textContent=enabled?'On':'Off';
}
function toggleAutosave(){
  localStorage.setItem('autosave_enabled',String(!isAutosaveEnabled()));
  updateAutosaveButton();
  if(isAutosaveEnabled())autosaveCurrentSheet();
}
function autosaveCurrentSheet(){
  if(!isAutosaveEnabled()||viewOnly)return;
  if(!document.getElementById('margin-editor-view').classList.contains('hidden')){
    if(!currentMarginSheetId)return;
    const data={id:currentMarginSheetId,name:document.getElementById('margin-sheet-name').value.trim()||'Untitled Sheet',date:document.getElementById('margin-sheet-date').value,totalProfit:calculateMarginProfit(),items:[...document.querySelectorAll('#margin-products-tbody tr')].map(row=>({name:row.querySelector('.margin-name').value,sellPrice:+row.querySelector('.margin-sell').value||0,buyPrice:+row.querySelector('.margin-buy').value||0,qty:+row.querySelector('.margin-qty').value||0}))};
    const index=marginSheets.findIndex(sheet=>sheet.id===currentMarginSheetId);
    if(index<0)marginSheets.push(data);else marginSheets[index]=data;
    localStorage.setItem('margin_sheets',JSON.stringify(marginSheets));
  }
}
function goBackToSheets(){
  if(isAutosaveEnabled())autosaveCurrentSheet();
  showPage('home');
}
function cancelMarginSheet(){
  goBackToSheets();
}
document.addEventListener('input',event=>{
  if(event.target.closest('#margin-editor-view'))autosaveCurrentSheet();
});
window.addEventListener('pagehide',autosaveCurrentSheet);
function updateThemeIcon(){
  const button=document.getElementById('theme-toggle');
  if(!button)return;
  const dark=document.body.classList.contains('dark');

  button.setAttribute('aria-label',button.title);
  button.innerHTML=dark
    ?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"></path></svg>'
    :'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>';
}

  document.body.classList.toggle('dark');

  updateThemeIcon();

function calculateTotal(){
  let total=0;
  document.querySelectorAll('.prod-price').forEach((x,i)=>{
    total+=(+x.value||0)*(+document.querySelectorAll('.prod-qty')[i].value||0);
  });
  document.getElementById('grand-total').textContent=total.toFixed(2);
}
function calculateMarginProfit(){
  return [...document.querySelectorAll('#margin-products-tbody tr')].reduce((total,row)=>{
    const sell=+row.querySelector('.margin-sell').value||0;
    const buy=+row.querySelector('.margin-buy').value||0;
    const qty=+row.querySelector('.margin-qty').value||0;
    return total+(sell-buy)*qty;
  },0);
}
function calculateMarginTotal(){
  const editor=document.getElementById('margin-editor-view');
  const showCost=!editor.classList.contains('hide-buy-price');
  let sales=0,cost=0,profit=0;
  document.querySelectorAll('#margin-products-tbody tr').forEach(row=>{
    const sell=+row.querySelector('.margin-sell').value||0;
    const buy=+row.querySelector('.margin-buy').value||0;
    const qty=+row.querySelector('.margin-qty').value||0;
    sales+=sell*qty;cost+=buy*qty;profit+=(sell-buy)*qty;
  });
  document.getElementById('margin-sales-total').textContent=`Total: PKR ${sales.toFixed(2)}`;
  document.getElementById('margin-cost-total').textContent=`Total Cost: PKR ${cost.toFixed(2)}`;
  document.getElementById('margin-profit-total').textContent=`Total Profit: PKR ${profit.toFixed(2)}`;
  document.getElementById('margin-sales-total').classList.toggle('hidden',showCost);
  document.getElementById('margin-cost-total').classList.toggle('hidden',!showCost);
  document.getElementById('margin-profit-total').classList.toggle('hidden',!showCost);
}

function renderMargins(){
  const list=document.getElementById('margins-list');
  const search=(document.getElementById('sheet-search')?.value||'').trim();
  const normalizeSearch=value=>String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
  const searchTerms=normalizeSearch(search).split(/\s+/).filter(Boolean);
  const sort=document.getElementById('sheet-sort')?.value||'date-desc';
  const favoriteCount=document.getElementById('favorite-count');
  if(favoriteCount)favoriteCount.textContent=favoriteSheetIds.size?`(${favoriteSheetIds.size})`:'';
  const filtered=marginSheets.filter(sheet=>{
    if(sheetView==='favorites'&&!favoriteSheetIds.has(String(sheet.id)))return false;
    if(!search)return true;
    const searchableText=normalizeSearch([
      sheet.name,sheet.date,
      ...(sheet.items||[]).flatMap(item=>[item.name,item.sellPrice,item.buyPrice,item.qty])
    ].join(' '));
    return searchTerms.every(term=>searchableText.includes(term));
  });
  filtered.sort((a,b)=>{
    if(sort==='name-asc')return String(a.name||'Untitled Sheet').localeCompare(String(b.name||'Untitled Sheet'));
    if(sort==='profit-desc')return (Number(b.totalProfit)||0)-(Number(a.totalProfit)||0);
    const dateOrder=String(a.date||'').localeCompare(String(b.date||''));
    return sort==='date-asc'?dateOrder:-dateOrder;
  });
  list.innerHTML=filtered.length?'':`<p>${sheetView==='favorites'?(search?'No favourites match your search.':'No favourite sheets yet. Mark a sheet with ☆ to save it here.'):(marginSheets.length?(search?'No sheets match your search.':'No sheets yet.'):'No sheets yet. Create a sheet to start tracking your products and profit.')}</p>`;
  let activeDate=null;
  filtered.forEach(sheet=>{
    const dateKey=sheet.date||'No date';
    if(dateKey!==activeDate){
      activeDate=dateKey;
      let dateLabel=dateKey;
      if(dateKey!=='No date'){
        const today=localDateInputValue();
        const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
        const yesterdayKey=new Date(yesterday.getTime()-yesterday.getTimezoneOffset()*60000).toISOString().split('T')[0];
        dateLabel=dateKey===today?'Today':dateKey===yesterdayKey?'Yesterday':new Date(`${dateKey}T12:00:00`).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
      }
      const divider=document.createElement('div');divider.className='sheet-date-divider';divider.textContent=dateLabel;list.appendChild(divider);
    }
    const card=document.createElement('div');card.className='sheet-card';
    const itemCount=(sheet.items||[]).filter(item=>String(item.name||'').trim()).length;
    const isFavorite=favoriteSheetIds.has(String(sheet.id));
    card.innerHTML=`<div class="sheet-info"><h3>${escapeHtml(sheet.name||'Untitled Sheet')}</h3><p>${escapeHtml(sheet.date||'No date')} · ${itemCount} product${itemCount===1?'':'s'} · Profit: PKR ${(Number(sheet.totalProfit)||0).toFixed(2)}</p></div><div class="card-actions"><button class="favorite-btn${isFavorite?' active':''}" type="button" aria-label="${isFavorite?'Remove from':'Add to'} favourites" aria-pressed="${isFavorite}" title="${isFavorite?'Remove from':'Add to'} favourites" onclick="event.stopPropagation();toggleFavoriteSheet('${escapeHtml(sheet.id)}')">${isFavorite?'★':'☆'}</button><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();editMarginSheet('${escapeHtml(sheet.id)}')">Edit</button><button class="btn btn-danger btn-sm" aria-label="Delete margin sheet" onclick="event.stopPropagation();deleteMarginSheet('${escapeHtml(sheet.id)}')">×</button></div>`;
    card.onclick=()=>viewMarginSheet(sheet.id);list.appendChild(card);
  });
}

function downloadSheetImage(type,{frame='midnight',format='jpg',ratio='4:5'}={}){
  const isMargin=type==='margin';
  const name=document.getElementById(isMargin?'margin-sheet-name':'sheet-name').value.trim()||'sheet';
  const date=document.getElementById(isMargin?'margin-sheet-date':'sheet-date').value||'N/A';
  const showBuyPrice=isMargin&&!document.getElementById('margin-editor-view').classList.contains('hide-buy-price');

  const [width,height]=ratioDimensions[ratio]||ratioDimensions['4:5'];

  const ctx=canvas.getContext('2d');

    ?{bg:'#f5f4fb',head:'#e9e4f5',text:'#211c32',muted:'#716d82',accent:'#6338c9',grid:'#d8d1e8',rowA:'#fff',rowB:'#f1eef8'}
          :frame==='plain'
      ?{bg:'#ffffff',head:'#ffffff',text:'#202124',muted:'#5f6368',accent:'#202124',grid:'#e5e7eb',rowA:'#ffffff',rowB:'#ffffff'}

  const headerHeight=Math.round(height*.14),columnHeaderHeight=Math.round(height*.075),footerHeight=Math.round(height*.105);
  const rowHeight=(height-headerHeight-columnHeaderHeight-footerHeight)/Math.max(rows.length,1);
  const proportions=isMargin
    ?(showBuyPrice?(width<1000?[.08,.43,.18,.18,.13]:[.07,.45,.18,.18,.12]):(width<1000?[.09,.55,.23,.13]:[.08,.58,.23,.11]))
    :(width<1000?[.08,.42,.30,.20]:[.07,.48,.27,.18]);
  const widths=proportions.map(part=>part*width);
  ctx.fillStyle=palette.bg;ctx.fillRect(0,0,width,height);
  ctx.fillStyle=palette.head;ctx.fillRect(0,0,width,headerHeight);
  ctx.textBaseline='middle';ctx.fillStyle=palette.text;
  const titleFont=Math.max(20,Math.min(36,width*.033));
  ctx.font=`bold ${titleFont}px Arial`;ctx.fillText(name,width*.035,headerHeight*.36,width*.92);
  ctx.font=`${Math.max(13,titleFont*.52)}px Arial`;ctx.fillStyle=palette.muted;
  ctx.fillText('Date: '+date,width*.035,headerHeight*.73,width*.92);
  const headers=isMargin?(showBuyPrice?['No.','Product','Price','Cost Price','Qty']:['No.','Product','Price','Qty']):['No.','Product','Price (PKR)','Qty'];
  let y=headerHeight,x=0;
  const headFont=Math.max(11,Math.min(18,width*.016));
  ctx.font=`bold ${headFont}px Arial`;
  headers.forEach((header,index)=>{
    ctx.fillStyle=palette.head;ctx.fillRect(x,y,widths[index],columnHeaderHeight);
    ctx.fillStyle=palette.accent;ctx.fillText(header,x+widths[index]*.06,y+columnHeaderHeight/2,Math.max(0,widths[index]*.88));
    ctx.strokeStyle=palette.grid;ctx.lineWidth=1;ctx.strokeRect(x,y,widths[index],columnHeaderHeight);x+=widths[index];
  });
  y+=columnHeaderHeight;
  rows.forEach((row,index)=>{
    const values=isMargin
      ?(showBuyPrice?[index+1,row.querySelector('.margin-name').value,row.querySelector('.margin-sell').value,row.querySelector('.margin-buy').value,row.querySelector('.margin-qty').value,'']: [index+1,row.querySelector('.margin-name').value,row.querySelector('.margin-sell').value,row.querySelector('.margin-qty').value,''])
      :[index+1,row.querySelector('.prod-name').value,row.querySelector('.prod-price').value,row.querySelector('.prod-qty').value];
    x=0;
    const fontSize=Math.max(10,Math.min(17,rowHeight*.34));
    ctx.font=`${fontSize}px Arial`;
    values.forEach((value,column)=>{
      ctx.fillStyle=index%2?palette.rowB:palette.rowA;ctx.fillRect(x,y,widths[column],rowHeight);
      ctx.fillStyle=palette.text;
      ctx.fillText(String(value||''),x+widths[column]*.06,y+rowHeight/2,Math.max(0,widths[column]*.88));
      ctx.strokeStyle=palette.grid;ctx.lineWidth=1;ctx.strokeRect(x,y,widths[column],rowHeight);x+=widths[column];
    });
    y+=rowHeight;
  });
  const footerY=height-footerHeight;
  ctx.fillStyle=palette.head;ctx.fillRect(0,footerY,width,footerHeight);
  ctx.fillStyle=palette.accent;
  const totalFont=Math.max(12,Math.min(20,width*.019));ctx.font=`bold ${totalFont}px Arial`;
  if(isMargin&&showBuyPrice){
    const salesTotal=[...rows].reduce((sum,row)=>sum+(+row.querySelector('.margin-sell').value||0)*(+row.querySelector('.margin-qty').value||0),0);
    const costTotal=[...rows].reduce((sum,row)=>sum+(+row.querySelector('.margin-buy').value||0)*(+row.querySelector('.margin-qty').value||0),0);
    const profitTotal=calculateMarginProfit();
    ctx.fillText('Sales: PKR '+salesTotal.toFixed(2),width*.025,footerY+footerHeight/2,width*.30);
    ctx.fillText('Cost: PKR '+costTotal.toFixed(2),width*.36,footerY+footerHeight/2,width*.29);
    ctx.fillText('Profit: PKR '+profitTotal.toFixed(2),width*.68,footerY+footerHeight/2,width*.29);
  }else{
    const total=isMargin?[...rows].reduce((sum,row)=>sum+(+row.querySelector('.margin-sell').value||0)*(+row.querySelector('.margin-qty').value||0),0).toFixed(2):document.getElementById('grand-total').textContent;
    ctx.fillText((isMargin?'Total: PKR ':'Total Cost: PKR ')+total,width*.035,footerY+footerHeight/2,width*.93);
  }
  const mime=format==='png'?'image/png':'image/jpeg';
  const dataUrl=canvas.toDataURL(mime,.92);
  const baseName=name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()||'sheet';
  if(format==='pdf'){
    const printWindow=window.open('','_blank');
    if(!printWindow){showToast('Allow the print window to create a PDF');return;}
    printWindow.document.write(`<!doctype html><html><head><title>${escapeHtml(name)}</title><style>@page{margin:12mm}*{box-sizing:border-box}body{margin:0}img{display:block;width:100%;height:auto}</style></head><body><img src="${dataUrl}" alt="${escapeHtml(name)}" onload="window.print()"></body></html>`);
    printWindow.document.close();return;
  }
  const link=document.createElement('a');link.download=`${baseName}.${format}`;link.href=dataUrl;link.click();
}

function saveCurrentSheet(){
  if(viewOnly)return;
  const data={id:currentSheetId,name:document.getElementById('sheet-name').value.trim()||'Untitled Sheet',date:document.getElementById('sheet-date').value,totalCost:+document.getElementById('grand-total').textContent,items:[...document.querySelectorAll('#products-tbody tr')].map(r=>({name:r.querySelector('.prod-name').value,price:+r.querySelector('.prod-price').value||0,qty:+r.querySelector('.prod-qty').value||0}))};
  const index=sheets.findIndex(x=>x.id===currentSheetId);index<0?sheets.push(data):sheets[index]=data;
  localStorage.setItem('order_sheets',JSON.stringify(sheets));showToast('Sheet saved');
}
function saveCurrentMarginSheet(){
  if(viewOnly)return;
  const data={id:currentMarginSheetId,name:document.getElementById('margin-sheet-name').value.trim()||'Untitled Sheet',date:document.getElementById('margin-sheet-date').value,totalProfit:calculateMarginProfit(),items:[...document.querySelectorAll('#margin-products-tbody tr')].map(r=>({name:r.querySelector('.margin-name').value,sellPrice:+r.querySelector('.margin-sell').value||0,buyPrice:+r.querySelector('.margin-buy').value||0,qty:+r.querySelector('.margin-qty').value||0}))};
  const index=marginSheets.findIndex(x=>x.id===currentMarginSheetId);index<0?marginSheets.push(data):marginSheets[index]=data;
  localStorage.setItem('margin_sheets',JSON.stringify(marginSheets));showToast('Sheet saved');
}
</script>
<script>
  let deferredInstallPrompt = null;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(() => console.log('Service worker registered'))
        .catch(error => console.error('Service worker registration failed:', error));
    });
  }

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;

    const installButton = document.createElement('button');
    installButton.id = 'install-app-btn';
    installButton.className = 'btn btn-primary';
    installButton.textContent = 'Install App';
    installButton.style.cssText =
      'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:150;box-shadow:0 14px 32px rgba(0,0,0,.2)';

    installButton.onclick = async () => {
      if (!deferredInstallPrompt) return;

      deferredInstallPrompt.prompt();
      const result = await deferredInstallPrompt.userChoice;

      if (result.outcome === 'accepted') {
        installButton.remove();
      }

      deferredInstallPrompt = null;
    };

    document.body.appendChild(installButton);
  });

  window.addEventListener('appinstalled', () => {
    document.getElementById('install-app-btn')?.remove();
    deferredInstallPrompt = null;
  });
</script>
